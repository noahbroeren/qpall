<!-- Q-Pall Pallet Calculator (embed) -->
<style>
.qpc{--navy:#0c344e;--orange:#F37321;--orange-d:#d9531c;--green:#7dd32c;--bg:#f5f7f9;--line:#dfe5ea;--mut:#5c6b78;
  font-family:inherit;color:var(--navy);line-height:1.5;max-width:960px;margin:0 auto;padding:16px;box-sizing:border-box}
.qpc *{box-sizing:border-box}
.qpc button{font:inherit;cursor:pointer}
.qpc-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.qpc-steps{display:flex;gap:6px;flex:1}
.qpc-steps span{flex:1;text-align:center;font-size:.78rem;font-weight:600;padding:6px 4px;border-bottom:4px solid var(--line);color:var(--mut)}
.qpc-steps span.on{border-color:var(--orange);color:var(--navy)}
.qpc-steps span.done{border-color:var(--green);color:var(--navy)}
.qpc-lang button{border:1px solid var(--line);background:#fff;color:var(--navy);padding:4px 9px;font-size:.8rem}
.qpc-lang button:first-child{border-radius:6px 0 0 6px}.qpc-lang button:last-child{border-radius:0 6px 6px 0;border-left:0}
.qpc-lang button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.qpc h2{font-size:1.5rem;margin:8px 0 4px;color:var(--navy)}
.qpc-hint{color:var(--mut);margin:0 0 16px}
.qpc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.qpc-card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:6px;transition:.15s}
.qpc-card:hover,.qpc-card:focus-visible{border-color:var(--orange);box-shadow:0 6px 16px rgba(12,52,78,.12);transform:translateY(-2px);outline:none}
.qpc-card.sel{border-color:var(--orange);background:#fff6ef}
.qpc-card img,.qpc-card svg{width:100%;max-width:170px;height:110px;object-fit:contain}
.qpc-card b{font-size:1.05rem}
.qpc-card small{color:var(--mut);font-size:.85rem}
.qpc-card .tag{background:var(--green);color:var(--navy);font-size:.72rem;font-weight:700;border-radius:99px;padding:1px 9px}
.qpc-chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.qpc-chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;color:var(--navy);font-weight:600}
.qpc-chip.sel{border-color:var(--orange);background:#fff6ef}
.qpc-chip[disabled]{opacity:.4;cursor:not-allowed}
.qpc-btn{border:0;border-radius:10px;padding:13px 22px;font-weight:700;background:var(--orange);color:var(--navy)}
.qpc-btn:hover{background:var(--orange-d);color:#fff}
.qpc-btn[disabled]{opacity:.4;cursor:not-allowed;background:var(--orange);color:var(--navy)}
.qpc-btn.alt{background:#fff;border:2px solid var(--navy);color:var(--navy)}
.qpc-btn.alt:hover{background:var(--navy);color:#fff}
.qpc-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.qpc-back{background:none;border:0;color:var(--mut);padding:6px 0;text-decoration:underline}
.qpc-box{background:var(--bg);border-radius:12px;padding:14px 16px;margin:12px 0}
.qpc-box label{display:flex;gap:10px;align-items:center;font-weight:600}
.qpc input[type=number]{width:140px;padding:11px 12px;font-size:1.05rem;border:2px solid var(--line);border-radius:10px;color:var(--navy)}
.qpc input[type=checkbox],.qpc input[type=radio]{width:20px;height:20px;accent-color:var(--orange)}
.qpc-opt{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.qpc-opt.sel{border-color:var(--orange);background:#fff6ef}
.qpc-opt img{width:64px;height:48px;object-fit:contain}
.qpc-item{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.qpc-item img{width:72px;height:54px;object-fit:contain}
.qpc-item div{flex:1}.qpc-item small{color:var(--mut)}
.qpc-x{border:0;background:none;font-size:1.3rem;color:var(--mut)}
.qpc-res{background:var(--navy);color:#fff;border-radius:16px;padding:22px}
.qpc-res h2{color:#fff;margin-top:0}
.qpc-res .big{font-size:2.1rem;font-weight:800;color:var(--green);line-height:1.2}
.qpc-res ul{list-style:none;padding:0;margin:14px 0}
.qpc-res li{padding:10px 0;border-top:1px solid rgba(255,255,255,.18);display:flex;gap:12px;align-items:center}
.qpc-res li img{width:56px;height:42px;object-fit:contain;background:#fff;border-radius:6px}
.qpc-res li b{font-size:1.25rem;color:var(--green);min-width:70px}
.qpc-warn{background:#fff3cd;color:#5c4400;border-radius:10px;padding:12px 14px;margin:12px 0}
.qpc details{margin-top:14px}
.qpc pre{white-space:pre-wrap;background:#fff;color:var(--navy);border-radius:10px;padding:12px;font-size:.8rem;overflow:auto;border:1px solid var(--line)}
.qpc-res summary{cursor:pointer;color:#fff;font-weight:600}
.qpc-hide{display:none!important}
@media(max-width:520px){.qpc-grid{grid-template-columns:repeat(2,1fr);gap:10px}.qpc-card img,.qpc-card svg{height:84px}.qpc-steps span{font-size:.68rem}.qpc h2{font-size:1.25rem}}
</style>

        function addPalletRow() {
            const container = document.getElementById('palletRowsContainer');
            const rowId = (window.__qpRid = (window.__qpRid||0) + 1);

            const row = document.createElement('div');
            row.className = 'pallet-row';
            row.id = `row-${rowId}`;

            let optionsHtml = '';
            pallets.forEach(p => {
                optionsHtml += `<option value="${p.name}"></option>`;
            });

            row.innerHTML = `
        <div class="form-group" style="flex: 2;">
            <label>Select Pallet</label>
            <input list="pallets-list-${rowId}" class="pallet-select" placeholder="Search or select pallet...">
            <datalist id="pallets-list-${rowId}">
                ${optionsHtml}
            </datalist>
        </div>
        <div class="form-group" style="flex: 1;">
            <label>Quantity</label>
            <input type="text" class="pallet-amount" placeholder="Quantity or 'fill'" value="fill">

        <button class="remove-btn" onclick="removePalletRow('row-${rowId}')">✕</button>
    `;

            container.appendChild(row);

            // Listen for changes in the pallet selection

            if (input) {
                input.addEventListener('input', checkRunnersVisibility);

            checkRunnersVisibility();
        }

        function checkRunnersVisibility() {
            const specialPallets = ['QP76114LB9FR', 'QP1208LB9FR', 'QP1210LB9FR', 'QP1111LB9FR', 'QP1140LB9FR', 'QP1212LB9FR'];
            const inputs = document.querySelectorAll('.pallet-select');
            let specialSelected = [];

            inputs.forEach((input, index) => {
                const val = input.value;
                if (specialPallets.some(sp => val.includes(sp))) {
                    let displayName = val.split('(')[0].trim();
                    if (!displayName) displayName = val;
                    specialSelected.push({ val: displayName, index: index });
                }
            });

            const runnersSection = document.getElementById('runnersSection');
            const dynamicContainer = document.getElementById('dynamicRunnerSelections');

            if (runnersSection && dynamicContainer) {
                if (specialSelected.length > 0) {
                    runnersSection.style.display = 'block';

                    const existingMap = new Map();
                    dynamicContainer.querySelectorAll('.dynamic-runner-select').forEach(sel => {
                        existingMap.set(sel.id, sel.value);
                    });

                    let htmlContent = '';
                    specialSelected.forEach(item => {
                        const selectId = `runnerSelect_${item.index}`;
                        const currentVal = existingMap.has(selectId) ? existingMap.get(selectId) : "";
                        const attr0 = currentVal === "" || !currentVal ? "selected" : "";

                        let optionsHtml = `<option value="" disabled ${attr0}>Choose a runner type...</option>`;
                        optionsHtml += `<option value="none" ${currentVal === "none" ? "selected" : ""}>No runner</option>`;
                        if (typeof runnerPallets !== "undefined") {
                            let allowedRunners = [];
                            if (['QP76114LB9FR', 'QP1208LB9FR', 'QP1210LB9FR', 'QP1208LB9FR folie', 'QP1210LB9FR folie'].includes(item.val)) {
                                allowedRunners = ['QP-RUN-L', 'QP-RUN-H'];
                            } else if (typeof defaultRunners !== "undefined" && defaultRunners[item.val]) {
                                allowedRunners = [defaultRunners[item.val]];
                            } else {
                                // Fallback just in case, show all
                                allowedRunners = Object.keys(runnerPallets);
                            }

                            allowedRunners.forEach(rId => {
                                if (runnerPallets[rId]) {
                                    let r = runnerPallets[rId];
                                    optionsHtml += `<option value="${r.id}" ${currentVal === r.id ? "selected" : ""}>${r.name}</option>`;
                                }
                            });
                        }

                        htmlContent += `
                            <div class="form-group runner-group">
                                <label for="${selectId}">Runner Type for ${item.val}</label>
                                <select id="${selectId}" class="dynamic-runner-select" required>
                                    ${optionsHtml}
                                </select>
                            </div>
                        `;
                    });
                    dynamicContainer.innerHTML = htmlContent;
                } else {
                    runnersSection.style.display = 'none';
                    dynamicContainer.innerHTML = '';
                }
            }
        }

        function removePalletRow(rowId) {

            if (mixStrategySection) {
