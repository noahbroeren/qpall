 },
 size(){
  return `<h2>${t('t_size')}</h2><p class="qpc-hint">${t('h_size')}</p><div class="qpc-grid">${SIZES.map(z=>card('size',z.id,pic(z.v[0][0]),z.dim,z.sub?z.sub[lang]:'',s.size===z.id,z.pop?t('common'):'')).join('')}</div>${back('veh')}`;
 },
 type(){
  const z=SIZES.find(x=>x.id===s.size);
  return `<h2>${t('t_type')} <small style="font-weight:400">· ${z.dim}</small></h2><p class="qpc-hint">${t('h_type')}</p><div class="qpc-grid">${z.v.map(v=>card('sku',v[0],pic(v[0]),t(v[1])+(v[2]?' · '+t(v[2]):''),t('b_'+v[1])+`<br><span style="opacity:.7">${v[0]}</span>`,s.sku===v[0])).join('')}</div>${back('size')}`;
 },
 amt(){
  return `<h2>${t('t_amt')}</h2><p class="qpc-hint">${t('h_amt')}</p>
   <div class="qpc-item"><img src="${img(s.sku)}" alt=""><div><b>${itemLabel(s.sku)}</b><br><small>${s.sku}</small></div></div>
   <label class="qpc-opt ${s.mode==='fill'?'sel':''}"><input type="radio" name="m" data-act="mode" data-v="fill" ${s.mode==='fill'?'checked':''}><div><b>${t('fill')}</b><br><small>${t('fill_s')}</small></div></label>
   <label class="qpc-opt ${s.mode==='num'?'sel':''}"><input type="radio" name="m" data-act="mode" data-v="num" ${s.mode==='num'?'checked':''}><div><b>${t('num')}</b><br>
     <input type="number" id="qpc-qty" min="1" inputmode="numeric" value="${s.qty}" placeholder="${t('pcs')}" ${s.mode==='num'?'':'disabled'}> <small>${t('pcs')}</small></div></label>
   ${isNest(s.sku)?`<label class="qpc-opt ${s.runners?'sel':''}"><input type="checkbox" data-act="runners" ${s.runners?'checked':''}><img src="${IMG.runner}" alt=""><div><b>${t('runners')}</b><br><small>${t('runners_s')}</small></div></label>`:''}
   <div class="qpc-row"><button class="qpc-btn" data-act="add">${t('add')}</button><button class="qpc-back" data-go="type">${t('back')}</button></div>`;
 },
 order(){
  return `<h2>${t('t_ord')}</h2><p class="qpc-hint">${t('h_ord')}</p>
   <div class="qpc-item"><div><small>${t('s1')}</small><br><b>${vehLabelNow()}</b></div></div>
   ${s.items.map((it,i)=>`<div class="qpc-item"><img src="${img(it.sku)}" alt=""><div><b>${itemLabel(it.sku)}</b><br><small>${it.sku} · ${it.mode==='fill'?t('asmany'):nf(it.qty)+' '+t('pieces')}${isNest(it.sku)?' · '+t(it.runners?'with_r':'no_r'):''}</small></div><button class="qpc-x" data-act="del" data-v="${i}" aria-label="x">✕</button></div>`).join('')}
   <div class="qpc-row"><button class="qpc-btn" data-act="calc" ${s.items.length?'':'disabled'}>${t('calc')}</button><button class="qpc-btn alt" data-go="size">${t('addmore')}</button></div>`;
 },
 res(){
  const r=lastResult, isC=s.cat==='cont';
  const tot=r?r.totals:{}, rows=[];
  s.items.forEach(it=>{
   const got=tot[it.sku]||0, want=it.mode==='num'?it.qty:null;
   rows.push({sku:it.sku,txt:itemLabel(it.sku),n:got,short:want!==null&&got<want?want:0});
  });
  const rn={}; Object.keys(tot).forEach(k=>{if(runnerPallets[k])rn[k]=tot[k];});
  const unit=n=>n===1?t(isC?'container':'truck'):t(isC?'containers':'trucks');
  const anyShort=rows.some(x=>x.short)||!rows.some(x=>x.n>0)||(r&&r.failed);
  const fixedAll=s.items.every(i=>i.mode==='num');
  const head = !r||!rows.some(x=>x.n>0) ? `<div class="big">–</div>` : fixedAll&&r.trailerCount>=1&&!anyShort ? `<div>${t('need')}</div><div class="big">${r.trailerCount} ${unit(r.trailerCount)}</div>` : `<div class="big">${t('fits')}</div>`;
  const list = rows.map(x=>`<li><img src="${img(x.sku)}" alt=""><b>${nf(x.n)}×</b><span>${x.txt}${x.short?`<br><small>${t('onlyfit')} ${nf(x.n)} ${t('of')} ${nf(x.short)}</small>`:''}</span></li>`).join('')
   + Object.keys(rn).map(k=>`<li><img src="${IMG.runner}" alt=""><b>${nf(rn[k])}×</b><span>${runnerPallets[k].name} · ${t('runner_l')}</span></li>`).join('');
  return `<div class="qpc-res"><h2>${t('t_res')}</h2><p style="opacity:.8;margin:0">${vehLabelNow()}${s.usable<100?' · '+s.usable+'%':''}</p>${head}
   ${anyShort?`<div class="qpc-warn">${rows.some(x=>x.n>0)?t('warn_fit'):t('warn_none')}</div>`:''}<ul>${list}</ul>
   <p style="opacity:.8;font-size:.85rem">${t('note')}</p>
   <div class="qpc-row"><a class="qpc-btn" href="${CONTACT}" target="_blank" rel="noopener" style="text-decoration:none">${t('contact')}</a>
    <button class="qpc-btn alt" style="background:transparent;color:#fff;border-color:#fff" data-act="copy">${t('copy')}</button>
    <button class="qpc-btn alt" style="background:transparent;color:#fff;border-color:#fff" data-act="again">${t('again')}</button></div>
   ${r&&r.plan?`<details><summary>${t('plan')}</summary><pre>${esc(r.plan)}${r.alt?'\n\n'+esc(r.alt):''}</pre></details>`:''}</div>${back('order')}`;
 }
};
const esc = x => x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function render(){ steps(); main.innerHTML = VIEW[s.step](); }
function go(step){ s.step=step; render(); root.scrollIntoView({behavior:'smooth',block:'start'}); }

/* ---- rekenen: vul de verborgen invoer van de rekenmotor en draai hem ---- */
function runCalc(){
 const q = id => document.getElementById(id);
 q('trailerSelect').value = s.veh;
 q('trailerPercentage').value = s.usable;
 q('palletRowsContainer').innerHTML = '';
 s.items.forEach(it=>{
  addPalletRow();
  const row = q('palletRowsContainer').lastElementChild;
  row.querySelector('.pallet-select').value = pallets.find(p=>p.id===it.sku).name;
  row.querySelector('.pallet-amount').value = it.mode==='fill' ? 'fill' : it.qty;
 });
 checkRunnersVisibility();
 s.items.forEach((it,i)=>{ const sel=q('runnerSelect_'+i); if(sel) sel.value = it.runners ? NEST_RUNNER(it.sku) : 'none'; });
 lastResult = null;
 calculateLoad();
}

/* ---- klikken ---- */
root.addEventListener('click', e=>{
 const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
 const b = e.target.closest('[data-act]'); if(!b) return;
 const a=b.dataset.act, v=b.dataset.v;
 if(a==='cat'){ s.cat=v; s.veh=null;
   if(v==='taut'||v==='mega'){ s.veh=v==='taut'?'tautliner':v; s.vehLabel=t(v); go('size'); } else render(); }
 else if(a==='veh'){ s.veh=v; s.vehLabel=b.dataset.l; go('size'); }
 else if(a==='clen'){ s.clen=v; if(v!=='45'&&s.ctype==='pw') s.ctype='std'; render(); }
 else if(a==='ctype'){ s.ctype=v; render(); }
 else if(a==='contgo'){ s.veh='container'+s.clen+(s.ctype==='hc'?'hc':s.ctype==='pw'?'pw':''); go('size'); }
 else if(a==='size'){ s.size=v; go('type'); }
 else if(a==='sku'){ s.sku=v; s.mode='fill'; s.qty=''; s.runners=true; go('amt'); }
 else if(a==='add'){
   const n=parseInt(document.getElementById('qpc-qty').value,10);
   if(s.mode==='num'&&!(n>0)){ document.getElementById('qpc-qty').focus(); return; }
   s.items.push({sku:s.sku,mode:s.mode,qty:s.mode==='num'?n:0,runners:isNest(s.sku)&&s.runners}); go('order'); }
 else if(a==='del'){ s.items.splice(+v,1); render(); }
 else if(a==='calc'){ runCalc(); go('res'); }
 else if(a==='again'){ s.items=[]; s.cat=s.veh=null; s.clen=null; go('veh'); }
 else if(a==='copy'){
   const txt=[vehLabelNow(),...[...main.querySelectorAll('.qpc-res li')].map(li=>li.innerText.replace(/\n+/g,' '))].join('\n');
   try{ navigator.clipboard.writeText(txt); b.textContent=t('copied'); }catch(err){} }
});
root.addEventListener('change', e=>{
 const el=e.target, a=el.dataset.act; if(!a) return;
 if(a==='mode'){ s.mode=el.dataset.v; const q=document.getElementById('qpc-qty'); s.qty=q.value; render(); if(s.mode==='num') document.getElementById('qpc-qty').focus(); }
 else if(a==='runners'){ s.runners=el.checked; render(); }
});
root.addEventListener('input', e=>{
 if(e.target.dataset.act==='usable'){ s.usable=+e.target.value; document.getElementById('qpc-uv').textContent=s.usable+'%'; }
 if(e.target.id==='qpc-qty') s.qty=e.target.value;
});
root.querySelector('.qpc-lang').addEventListener('click', e=>{
 const l=e.target.dataset.lang; if(!l) return; lang=l; try{localStorage.setItem('qpc-lang',l);}catch(err){}
 if(s.cat==='taut'||s.cat==='mega') s.vehLabel=t(s.cat); render();
});
render();

})();
</script>
