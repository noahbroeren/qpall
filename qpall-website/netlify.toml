# Netlify configuratie voor qpall.com
[build]
  publish = "."

# Functie submission-created: stuurt na elke offerteaanvraag de bevestigingsmail via Brevo (update 37).
# Zet in Netlify de omgevingsvariabele BREVO_API_KEY; zonder sleutel verstuurt de functie niets.
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Robots-Tag = "noindex"

# Canonieke host: www.qpall.com, zoals de huidige site (update 42; zet in Netlify www.qpall.com als primair domein)
[[redirects]]
  from = "https://qpall.com/*"
  to = "https://www.qpall.com/:splat"
  status = 301
  force = true
